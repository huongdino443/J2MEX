plugins { id 'com.android.application' }
def fontScalePercent = (project.findProperty('fontScalePercent') ?: '85')
        .toString().toInteger()
def fontBuildVersionCode = (project.findProperty('buildVersionCode') ?: '289')
        .toString().toInteger()
def fontBuildVersionName = (project.findProperty('buildVersionName')
        ?: "0.1.1").toString()
def releaseKeystoreFile = file("$rootDir/keys/j2mex-release.p12")
def releaseKeystorePassword = System.getenv("J2MEX_RELEASE_KEYSTORE_PASSWORD") ?: ""
if (fontScalePercent < 1 || fontScalePercent > 200)
    throw new GradleException("fontScalePercent must be between 1 and 200")
android {
    namespace 'org.recompile.freej2me.lite'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.huongdino443.j2mex'
        minSdk 21
        targetSdk 34
        versionCode fontBuildVersionCode
        versionName fontBuildVersionName
        buildConfigField 'int', 'FONT_SCALE_PERCENT', "${fontScalePercent}"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storeType 'PKCS12'
            storePassword releaseKeystorePassword
            keyAlias 'j2mex-release'
            keyPassword releaseKeystorePassword
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { debuggable true }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets { main.java.srcDir '../../src/org/recompile/freej2me/protocol' }
    androidResources { noCompress += ['xz'] }
}
dependencies { implementation 'org.tukaani:xz:1.10' }
